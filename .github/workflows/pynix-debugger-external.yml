name: PYNIX debugger cross-repository verification

on:
  push:
    branches: [feature/icon-system-v4]
    paths:
      - '.github/workflows/pynix-debugger-external.yml'
  workflow_dispatch:

jobs:
  compiler-debugger:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PYNIX_GUI bridge tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout PYNIX compiler
        uses: actions/checkout@v4
        with:
          repository: Sergey-Bulavka/PYNIX
          # PYNIX is private: GITHUB_TOKEN from PYNIX_GUI cannot read it.
          # Configure a fine-grained token with PYNIX Contents: read.
          token: ${{ secrets.PYNIX_CI_READ_TOKEN }}
          ref: main
          path: pynix-compiler
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PYNIX test dependencies
        run: python -m pip install -e ./pynix-compiler pytest
      - name: Compile compiler sources
        run: python -m compileall -q pynix-compiler/compiler
      - name: Verify real IDE-to-compiler debugger bridge
        env:
          PYTHONPATH: ${{ github.workspace }}/pynix-compiler
        run: python scripts/test_real_debugger_bridge.py
      - name: Run real debugger integration tests
        working-directory: pynix-compiler
        run: python -m pytest -q tests/test_debug_protocol.py tests/test_debug_execution.py tests/test_debug_frames.py tests/test_debug_session.py tests/test_debug_dispatch.py tests/test_debug_worker.py
